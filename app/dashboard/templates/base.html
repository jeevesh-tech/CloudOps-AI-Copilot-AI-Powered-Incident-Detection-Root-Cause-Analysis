<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}CloudOps AI Copilot{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #171e2e;
      --border: #2a3348;
      --text: #e6e9f0;
      --muted: #9aa4b8;
      --high: #e5484d;
      --medium: #f5a623;
      --low: #4c9aff;
      --accent: #4c9aff;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .subtitle { color: var(--muted); margin-bottom: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    th { color: var(--muted); font-weight: 600; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #0f1420;
    }
    .badge.HIGH { background: var(--high); color: white; }
    .badge.MEDIUM { background: var(--medium); }
    .badge.LOW { background: var(--low); color: white; }
    .badge.UNKNOWN { background: var(--muted); color: white; }
    .counts { display: flex; gap: 16px; margin-bottom: 16px; }
    .count-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      text-align: center;
    }
    .count-box .n { font-size: 1.6rem; font-weight: 700; }
    .count-box .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    .kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; }
    .kv div:nth-child(odd) { color: var(--muted); }
    ul.plain { margin: 4px 0; padding-left: 20px; }
    .log-line { font-family: Consolas, monospace; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .log-ERROR { color: var(--high); }
    .log-WARN { color: var(--medium); }
    .log-INFO { color: var(--muted); }
    .back-link { display: inline-block; margin-bottom: 16px; }
    nav.topnav { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    nav.topnav a { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
    nav.topnav a:hover { color: var(--text); text-decoration: none; }
    .chat-answer { line-height: 1.5; }
    .chat-answer h1, .chat-answer h2, .chat-answer h3 { font-size: 1rem; color: var(--text); margin: 12px 0 4px; }
    .chat-answer p { margin: 6px 0; }
    .chat-answer ul, .chat-answer ol { margin: 6px 0; padding-left: 22px; }
    .chat-answer li { margin: 2px 0; }
    .chat-answer strong { color: var(--text); }
    .chat-answer code { background: #0f1420; padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 0.85em; }
    .chat-answer pre { background: #0f1420; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .chat-answer hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a href="/">Incidents</a>
    <a href="/chat">Chat</a>
  </nav>
  {% block content %}{% endblock %}
  <script>
    document.querySelectorAll(".chat-form").forEach(function (form) {
      form.addEventListener("submit", function () {
        var button = form.querySelector(".chat-submit");
        var input = form.querySelector("input[name='question']");
        if (button) {
          button.disabled = true;
          button.textContent = "Please wait...";
          button.style.opacity = "0.7";
          button.style.cursor = "wait";
        }
        if (input) {
          input.readOnly = true;
        }
      });
    });
  </script>
</body>
</html>
